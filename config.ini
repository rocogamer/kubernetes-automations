[global]
multi_node = false
firewall = true
# Enable to provision VMs in Proxmox before K8s installation
proxmox_provision = false

[node_firewall]
iptables = true
iptables_save = false
firewalld = false
firewalld_zone = public
ufw = false
firewall_script = NA

# Seccion para el nodo con hostname k8s-master
[node_k8s-master]
node_type = master

[k8s]
# k8s config
# if multi_node is true, the following config will be ignored
# if multi_node is false, the following config will be used
# master or worker
version = 1.28.1-*
k8s_apt_version = v1.28
master_ha_installation = false
master_load_balancer_ip =
ha_auth_pass = k8s_ha_pass
# Only for workers or secondary masters, if master_ip is not empty, it will be considered as a secondary master
master_ip =
master_port =
master_token =
master_cert =
master_key =
# Only is used if node is master
master_etcd_backup = true

[k8s_etc_backup]
# k8s etcd backup config
# Only is used if node is master
local_save = true
local_directory = /opt/backup

[k8s_components]
# k8s components config
# calico or flannel
network = calico
calico_version = v3.26.1
flannel_cni_version = v1.2.0
storage = true
monitoring = true
security = true
opa = true
loadbalancer = true
ingress = true
metricas = true

[k8s_components_storage]
longhorn = true
longhorn_version = v1.5.1
rook = false
rook_version = v1.12.5
ceph = false
flexvolume = true

[k8s_components_monitoring]
grafana = true
check_mk = true

[k8s_components_security]
falco = true
falco_version = 0.36.2

[k8s_components_opa]
gatekeeper = true
gatekeeper_version = v3.13.3

[k8s_components_loadbalancer]
metalb = true
metallb_version = v0.13.12

[k8s_components_ingress]
traefik = false
nginx_ingress = true
nginx_ingress_version = v1.8.2
nginx_ingress_by_kubernetes = false
haproxy_ingress = false
haproxy_ingress_version = v1.10

expose_service_has_loadbalancer = false
expose_service_has_node_port = true

[k8s_components_metricas]
kube_metrics_server = true

# =============================================================================
# PROXMOX PROVISIONING
# =============================================================================
# When proxmox_provision = true in [global], VMs are created automatically
# in a Proxmox VE host before starting the K8s installation.

[proxmox]
# Proxmox VE connection
host = 192.168.1.100
port = 8006
user = root@pam
password =
# Alternative: use API token instead of password
token_name =
token_value =
# Set to false if using self-signed certs
verify_ssl = false
# Proxmox node name (as shown in the PVE interface)
node = pve

# VM template to clone (must have cloud-init support)
# You can use a template ID or create VMs from scratch with an ISO
template_id = 0
# ISO for creating VMs from scratch (used when template_id = 0)
iso = local:iso/debian-12-genericcloud-amd64.qcow2
# Storage pool for VM disks
storage = local-lvm
# Network bridge
bridge = vmbr0
# VLAN tag (leave empty for no VLAN)
vlan =
# SSH public key to inject via cloud-init (path to file)
ssh_public_key_file = ~/.ssh/id_rsa.pub
# SSH private key for connecting to VMs after creation
ssh_private_key_file = ~/.ssh/id_rsa
# SSH user for cloud-init VMs
ssh_user = root
# DNS configuration for cloud-init
dns_domain =
dns_servers = 8.8.8.8 8.8.4.4
# Gateway for cloud-init network
gateway =
# Subnet mask in CIDR notation
cidr = 24
# Wait timeout in seconds for VM to get an IP
vm_ready_timeout = 300

# Define the VMs to create for the cluster
# Format: vm_<role>_<index> where role is master or worker
# Each VM needs: name, vmid, ip, cores, memory (MB), disk (GB)

[proxmox_vm_master_1]
name = k8s-master-1
vmid = 200
ip = 192.168.1.50
cores = 4
memory = 8192
disk = 50

[proxmox_vm_worker_1]
name = k8s-worker-1
vmid = 201
ip = 192.168.1.51
cores = 4
memory = 8192
disk = 50

[proxmox_vm_worker_2]
name = k8s-worker-2
vmid = 202
ip = 192.168.1.52
cores = 4
memory = 8192
disk = 50
